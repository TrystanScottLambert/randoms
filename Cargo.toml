[package]
name = "randoms"
version = "0.3.0"
edition = "2024"
description = "Generating randoms catalogue for redshift surveys."
license = "MIT"

[lib]
name = "randoms"
path = "src/lib.rs"

[profile.release]
debug = true

[dependencies]
csv = "1.3.1"
integrate = "0.1.11"
libm = "0.2"
rand = "0.9.2"
rand_chacha = "0.9"
rand_distr = "0.5"
rayon = "1.11.0"
roots = "0.0.8"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
